name: Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to build (for example v1.2.19)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag input
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Expected vMAJOR.MINOR.PATCH"; exit 1; }

      - name: Checkout exact version tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}

      - name: Check version matches tag
        shell: bash
        run: |
          version=$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test "v$version" = "$RELEASE_TAG"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build debug APK
        # Old Windows-authored tags lack the executable bit on gradlew.
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-daemon --console=plain

      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk "release/PureNote-${RELEASE_TAG}.apk"
          test -s "release/PureNote-${RELEASE_TAG}.apk"

      - name: Preserve build artifact
        uses: actions/upload-artifact@v4
        with:
          name: PureNote-${{ env.RELEASE_TAG }}
          path: release/*.apk
          if-no-files-found: error

      - name: Publish missing APK asset
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
          asset="PureNote-${RELEASE_TAG}.apk"
          existing=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name')
          if ! grep -Fxq "$asset" <<< "$existing"; then
            gh release upload "$RELEASE_TAG" "release/$asset"
          fi
          gh release view "$RELEASE_TAG" --json assets --jq '.assets[] | select(.size > 0) | .name' | grep -Fx "$asset"
